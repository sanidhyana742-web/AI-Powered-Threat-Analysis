{% extends "base.html" %}
{% block title %}Create Account | NCIRIP Platform{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-4 bg-cyan bg-opacity-10 border border-cyan border-opacity-25 mb-3" style="background: rgba(2,132,199,0.08);">
                <i class="fa-solid fa-user-plus fs-2" style="color: #0284c7;"></i>
            </div>
            <h3 class="fw-bold gradient-text m-0">Create Account</h3>
            <p class="text-muted small mt-1">Register for platform clearance and access</p>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-dark small fw-medium">Choose Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-secondary border-opacity-25 text-muted"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control bg-light border-secondary border-opacity-25 text-dark" placeholder="Choose username" required autocomplete="off">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label text-dark small fw-medium">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-secondary border-opacity-25 text-muted"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control bg-light border-secondary border-opacity-25 text-dark" placeholder="name@example.com" required autocomplete="email">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-dark small fw-medium">Secure Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-secondary border-opacity-25 text-muted"><i class="fa-solid fa-key"></i></span>
                    <input type="password" name="password" class="form-control bg-light border-secondary border-opacity-25 text-dark" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn w-100 fw-bold text-white py-2 rounded-pill shadow-sm mb-3" style="background: linear-gradient(135deg, #4f46e5, #0284c7);">
                Initialize Account
            </button>
        </form>

        <div class="text-center">
            <span class="text-muted small">Already registered?</span> 
            <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold small ms-1" style="color: #4f46e5;">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
